name: theorem-map
on:
  push:
    branches: [main]
  pull_request:
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -I scripts/test_check_theorem_map.py
      - run: python3 -I scripts/check_theorem_map.py
