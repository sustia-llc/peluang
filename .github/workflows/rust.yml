name: rust
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features f64-prob -- -D warnings
      - run: cargo clippy --all-targets --features parallel -- -D warnings
      - run: cargo clippy --all-targets --features async -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
      - name: docstring code-block guard
        run: |
          matches=$(rg -n '^\s*(///|//!).*`{3}' src/ || true)
          if [ -n "$matches" ]; then
            echo "::error::code block in a docstring:"
            echo "$matches"
            exit 1
          fi
      - name: duplicate dependency guard
        run: |
          dups=$(cargo tree --duplicates --all-features)
          if [ -n "$dups" ]; then
            echo "::error::duplicate dependency versions:"
            echo "$dups"
            exit 1
          fi
      - run: cargo nextest run
      - run: cargo nextest run --features f64-prob
      - run: cargo nextest run --features parallel
      - run: cargo nextest run --features async
      - run: cargo nextest run --all-features

  wasm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: wasm32-wasip1, wasm32-wasip1-threads, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Never `--workspace` or `--all-targets` on a wasm target: `--lib` only.
      - run: cargo check --lib --target wasm32-wasip1
      - run: cargo check --lib --features parallel --target wasm32-wasip1-threads
      - run: cargo check --lib --features async --target wasm32-wasip1-threads
      - run: cargo check --lib --target wasm32-unknown-unknown
