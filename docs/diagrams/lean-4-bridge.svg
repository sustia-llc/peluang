<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lean-4-bridge-title lean-4-bridge-desc" id="lean-4-bridge-root">
        <title id="lean-4-bridge-title">The bridge: a Lean theorem, its row, its witness</title>
        <desc id="lean-4-bridge-desc">The Lean theorem FinStoch.deterministic_iff_mass is named by a THEOREM_MAP.md row, which points to the Rust witness test that runs the engine's is_deterministic on one deterministic and one non-deterministic kernel.</desc>
        <defs>
      <style>#lean-4-bridge-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #lean-4-bridge-root { font-family: var(--font-sans); color: var(--color-ink); }
      #lean-4-bridge-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#lean-4-bridge-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="lean-4-bridge-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="lean-4-bridge-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="lean-4-bridge-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (bg → zones → arrows → nodes) -->
        <rect x="40" y="80" width="232" height="296" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="52" y="84" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="70" y="93" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">LEAN</text>

        <rect x="296" y="80" width="344" height="296" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="308" y="84" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="350" y="93" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">THEOREM_MAP.md</text>

        <rect x="664" y="80" width="256" height="296" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="676" y="84" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="694" y="93" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">RUST</text>

        <!-- Arrows (drawn before nodes) -->
        <line x1="260" y1="176" x2="308" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lean-4-bridge-arrow)"/>
        <line x1="628" y1="176" x2="676" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lean-4-bridge-arrow)"/>
        <line x1="792" y1="232" x2="792" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lean-4-bridge-arrow)"/>

        <!-- Node: Lean theorem -->
        <rect x="52" y="128" width="208" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="52" y="128" width="208" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="60" y="134" width="52" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="86" y="143" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">THEOREM</text>
        <text x="156" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">deterministic_iff_mass</text>
        <text x="156" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Deterministic f ↔ ∀ x y,</text>
        <text x="156" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">f.mass x y = 0</text>
        <text x="156" y="210" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">∨ f.mass x y = 1</text>

        <!-- Node: THEOREM_MAP row (focal) -->
        <rect x="308" y="112" width="320" height="128" rx="6" fill="#f5f5f5"/>
        <rect x="308" y="112" width="320" height="128" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="316" y="118" width="32" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="332" y="127" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ROW</text>
        <text x="320" y="148" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEAN ID</text>
        <text x="320" y="161" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">FinStoch.deterministic_iff_mass</text>
        <line x1="316" y1="168" x2="620" y2="168" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.25"/>
        <text x="320" y="180" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">RUST TEST</text>
        <text x="320" y="193" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">finstoch_tests.rs::witness_deterministic_iff_mass</text>
        <line x1="316" y1="200" x2="620" y2="200" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.25"/>
        <text x="320" y="212" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">ANCHOR</text>
        <text x="320" y="225" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Fritz 2020 Example 10.3 · post T12</text>

        <!-- Node: Rust witness test -->
        <rect x="676" y="120" width="232" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="676" y="120" width="232" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="684" y="126" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="700" y="135" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TEST</text>
        <text x="792" y="156" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">#[test] /// THEOREM_MAP:</text>
        <text x="792" y="168" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">…deterministic_iff_mass</text>
        <text x="792" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">is_deterministic(d): true</text>
        <text x="792" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">is_deterministic(s): false</text>
        <text x="792" y="216" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the 0/1 entry test agrees</text>

        <!-- Node: engine -->
        <rect x="676" y="280" width="232" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="676" y="280" width="232" height="72" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="684" y="286" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="698" y="295" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SRC</text>
        <text x="792" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Engine</text>
        <text x="792" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">kernel.rs · markov.rs</text>
        <text x="792" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">deterministic.rs</text>

        <!-- Caption (italic serif aside) -->
        <text x="40" y="420" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Lean proves the statement for every morphism; the Rust test pins the engine</text>
        <text x="40" y="440" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">at worked numbers, and tests/laws.rs pins the laws at generated matrices.</text>

        <!-- Legend strip -->
        <line x1="40" y1="540" x2="920" y2="540" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="568" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="60" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">The bridge row (focal)</text>

        <rect x="200" y="568" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="220" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Lean theorem · Rust test</text>

        <rect x="368" y="568" width="14" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="388" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Engine source</text>

        <rect x="488" y="568" width="14" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <text x="508" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Zone (source subgraph)</text>

        <line x1="648" y1="573" x2="676" y2="573" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lean-4-bridge-arrow)"/>
        <text x="684" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Source edge</text>
      </svg>
